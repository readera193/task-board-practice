services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: task-board-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "1434:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    container_name: task-board-backend

    depends_on:
      sqlserver:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=taskboard;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"

      JWT_SECRET: "${JWT_SECRET}"

volumes:
  sqlserver-data:
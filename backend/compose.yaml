services:
  mysql:
    image: mysql:8.4
    container_name: task-board-mysql

    environment:
      MYSQL_DATABASE: taskboard
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    image: ghcr.io/readera193/task-board-backend:latest
    container_name: task-board-backend

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: "jdbc:mysql://mysql:3306/taskboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei"
      DB_USERNAME: "root"
      DB_PASSWORD: "${DB_PASSWORD}"

      JWT_SECRET: "${JWT_SECRET}"

volumes:
  mysql-data: